<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prueba de registro · Sobre Ruedas</title>
<style>
  :root{--bg:#f6f6f4;--card:#fff;--tx:#1b1b1b;--mu:#666;--bd:#ddd;--ok:#0E9F6E;--err:#C81E1E;--ac:#F26B1D}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:760px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:8px 0 4px}
  h2{font-size:17px;margin:0 0 10px}
  p.sub{color:var(--mu);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:14px;color:var(--mu);margin:8px 0 3px}
  input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font:inherit}
  button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
  button.sec{background:#fff;color:var(--tx);border:1px solid var(--bd)}
  button:disabled{opacity:.6;cursor:default}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}
  .msg{border-radius:8px;padding:10px 12px;margin:10px 0 0;display:none}
  .msg.err{display:block;background:#FDECEC;color:var(--err);border:1px solid #F5B5B5}
  .msg.ok{display:block;background:#E7F6EF;color:#06603F;border:1px solid #A6DEC4}
  .tabla{width:100%;border-collapse:collapse;font-size:14px}
  .tabla th,.tabla td{text-align:left;padding:6px 4px;border-bottom:1px solid #eee;vertical-align:top}
  .scroll{overflow-x:auto}
  .pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:13px;font-weight:600}
  .pend{background:#FFF4D6;color:#8A5A00}.apro{background:#E7F6EF;color:#06603F}.rech{background:#FDECEC;color:var(--err)}
  .fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .fila select{width:auto}
  .fila button{margin-top:0;padding:6px 10px}
  .hide{display:none}
  .quien{font-size:15px}
</style>
</head>
<body>
<main>
  <h1>🔧 Prueba de registro</h1>
  <p class="sub">Página interna para probar la base. No tiene enlace desde la página de clientes.</p>

  <!-- Sin sesión -->
  <section id="fuera">
    <div class="card">
      <h2>Registrarme como cliente</h2>
      <form id="fReg">
        <div class="grid">
          <div><label for="rMail">Mail *</label><input id="rMail" type="email" required autocomplete="email"></div>
          <div><label for="rPass">Contraseña * (mínimo 6)</label><input id="rPass" type="password" required minlength="6" autocomplete="new-password"></div>
          <div><label for="rRazon">Razón social *</label><input id="rRazon" required></div>
          <div><label for="rCuit">CUIT</label><input id="rCuit" inputmode="numeric"></div>
          <div><label for="rContacto">Nombre de contacto</label><input id="rContacto"></div>
          <div><label for="rTel">Teléfono</label><input id="rTel" type="tel"></div>
          <div><label for="rZona">Zona</label><input id="rZona" placeholder="Ej.: Neuquén"></div>
          <div><label for="rDir">Dirección</label><input id="rDir"></div>
        </div>
        <button type="submit" id="bReg">Registrarme</button>
        <div class="msg" id="mReg"></div>
      </form>
    </div>
    <div class="card">
      <h2>Entrar</h2>
      <form id="fIn">
        <div class="grid">
          <div><label for="iMail">Mail</label><input id="iMail" type="email" required autocomplete="email"></div>
          <div><label for="iPass">Contraseña</label><input id="iPass" type="password" required autocomplete="current-password"></div>
        </div>
        <button type="submit" id="bIn">Entrar</button>
        <div class="msg" id="mIn"></div>
      </form>
    </div>
  </section>

  <!-- Con sesión -->
  <section id="dentro" class="hide">
    <div class="card fila" style="justify-content:space-between">
      <div class="quien">Entraste como <b id="yoMail"></b> · <span id="yoRol"></span></div>
      <button class="sec" id="bOut" style="margin-top:0">Salir</button>
    </div>
    <div class="msg" id="mDentro"></div>

    <div class="card" id="cMios">
      <h2>👤 Mis datos de cliente</h2>
      <div id="mios"></div>
    </div>

    <div class="card">
      <h2>📦 Productos con costo y listas</h2>
      <div id="prods"></div>
    </div>

    <div class="card" id="cAdmin">
      <h2>🗂️ Todos los clientes (solo admin)</h2>
      <div id="clis"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL = "https://tqmqlvlbfkjekxwccsty.supabase.co";
const SB_KEY = "sb_publishable_UdVpZD6Xem9M1wADl-X5JA_TyZkkx_q";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pesos = n => n == null ? "—" : "$ " + Number(n).toLocaleString("es-AR");

let sb = null;
try { sb = supabase.createClient(SB_URL, SB_KEY); }
catch (e) { mostrar($("mIn"), "err", "No se pudo conectar con la base: " + e.message + ". Recargá la página."); }

function mostrar(el, tipo, txt){ el.className = "msg " + tipo; el.textContent = txt; }
function limpiar(el){ el.className = "msg"; el.textContent = ""; }
/* Cartel rojo con Reintentar: nunca tragarse un error */
function errorConReintento(cont, txt, fn){
  cont.innerHTML = '<div class="msg err">' + esc(txt) + ' <button class="sec" type="button">🔄 Reintentar</button></div>';
  cont.querySelector("button").onclick = fn;
}
const traducir = m => ({
  "Invalid login credentials": "Mail o contraseña incorrectos.",
  "Email not confirmed": "Todavía no confirmaste el mail. Buscá el mail de confirmación (mirá también en Spam).",
  "User already registered": "Ese mail ya está registrado. Usá «Entrar».",
})[m] || m;

/* ===== Registro ===== */
$("fReg").addEventListener("submit", async ev => {
  ev.preventDefault();
  const m = $("mReg"); limpiar(m);
  const b = $("bReg"); b.disabled = true; b.textContent = "Registrando…";
  try {
    const { data, error } = await sb.auth.signUp({
      email: $("rMail").value.trim(),
      password: $("rPass").value,
      options: {
        emailRedirectTo: location.origin + location.pathname,
        data: {
          razon_social: $("rRazon").value, cuit: $("rCuit").value, contacto: $("rContacto").value,
          telefono: $("rTel").value, zona: $("rZona").value, direccion: $("rDir").value,
        },
      },
    });
    if (error) throw error;
    if (data.session) { mostrar(m, "ok", "¡Listo! Ya estás registrado."); $("fReg").reset(); }
    else if (data.user && data.user.identities && data.user.identities.length === 0) mostrar(m, "err", "Ese mail ya está registrado. Usá «Entrar».");
    else { mostrar(m, "ok", "¡Registrado! Te mandamos un mail para confirmar la cuenta. Confirmalo y después tocá «Entrar»."); $("fReg").reset(); }
  } catch (e) {
    /* No se borra lo que cargó: puede tocar Registrarme de nuevo */
    mostrar(m, "err", "No se pudo registrar: " + traducir(e.message) + " Revisá los datos y tocá «Registrarme» de nuevo.");
  } finally { b.disabled = false; b.textContent = "Registrarme"; }
});

/* ===== Entrar / salir ===== */
$("fIn").addEventListener("submit", async ev => {
  ev.preventDefault();
  const m = $("mIn"); limpiar(m);
  const b = $("bIn"); b.disabled = true; b.textContent = "Entrando…";
  try {
    const { error } = await sb.auth.signInWithPassword({ email: $("iMail").value.trim(), password: $("iPass").value });
    if (error) throw error;
  } catch (e) { mostrar(m, "err", "No se pudo entrar: " + traducir(e.message)); }
  finally { b.disabled = false; b.textContent = "Entrar"; }
});
$("bOut").onclick = async () => {
  const { error } = await sb.auth.signOut();
  if (error) mostrar($("mDentro"), "err", "No se pudo salir: " + error.message + ". Probá de nuevo.");
};

/* ===== Qué ve cada uno ===== */
async function cargar(user){
  $("yoMail").textContent = user.email;
  $("yoRol").textContent = "cargando…";
  limpiar($("mDentro"));
  const [adm, mios, prods] = await Promise.all([
    sb.from("admins").select("user_id").eq("user_id", user.id),
    sb.from("clientes").select("*").eq("user_id", user.id),
    sb.from("productos").select("sku,modelo,color,talle,costo,precio_ff,precio_china,precio_ba").order("modelo").order("sku"),
  ]);
  const reintentar = () => cargar(user);
  if (adm.error) { $("yoRol").textContent = ""; return errorConReintento($("mios"), "No se pudo leer tu usuario: " + adm.error.message, reintentar); }
  const esAdmin = adm.data.length > 0;
  $("yoRol").innerHTML = esAdmin ? "<b>ADMIN</b>" : "cliente";

  // Mis datos
  if (mios.error) errorConReintento($("mios"), "No se pudieron leer tus datos: " + mios.error.message, reintentar);
  else if (!mios.data.length) $("mios").innerHTML = esAdmin ? "<p>Este usuario es admin y no tiene ficha de cliente.</p>" : "<p>No hay ficha de cliente para este usuario.</p>";
  else {
    const c = mios.data[0];
    const est = {pendiente:'<span class="pill pend">Pendiente de aprobación</span>', aprobado:'<span class="pill apro">Aprobado</span>', rechazado:'<span class="pill rech">Rechazado</span>'}[c.estado];
    $("mios").innerHTML = `<p>${est} ${c.categoria ? "· Categoría: <b>" + esc(c.categoria === "ff" ? "Fly Free" : "Mayorista") + "</b>" : ""}</p>
      <div class="scroll"><table class="tabla"><tr><th>Razón social</th><td>${esc(c.razon_social)}</td></tr>
      <tr><th>CUIT</th><td>${esc(c.cuit)}</td></tr><tr><th>Contacto</th><td>${esc(c.contacto)}</td></tr>
      <tr><th>Teléfono</th><td>${esc(c.telefono)}</td></tr><tr><th>Zona</th><td>${esc(c.zona)}</td></tr>
      <tr><th>Dirección</th><td>${esc(c.direccion)}</td></tr></table></div>`;
  }

  // Productos
  if (prods.error) errorConReintento($("prods"), "Error al leer productos: " + prods.error.message, reintentar);
  else if (!prods.data.length) $("prods").innerHTML = '<div class="msg ok">🔒 No ves ningún producto: <b>correcto</b>. Un cliente no puede ver el costo ni las otras listas. Sus precios le van a llegar por otro camino (etapa 4).</div>';
  else $("prods").innerHTML = `<p>Ves los <b>${prods.data.length}</b> productos con todas las listas (sin IVA).</p>
      <div class="scroll"><table class="tabla"><tr><th>SKU</th><th>Costo</th><th>FF</th><th>China</th><th>BA</th></tr>
      ${prods.data.map(p => `<tr><td>${esc(p.sku)}</td><td>${pesos(p.costo)}</td><td>${pesos(p.precio_ff)}</td><td>${pesos(p.precio_china)}</td><td>${pesos(p.precio_ba)}</td></tr>`).join("")}</table></div>`;

  // Clientes (admin)
  $("cAdmin").classList.toggle("hide", !esAdmin);
  if (esAdmin) cargarClientes(user);
}

async function cargarClientes(user){
  const cont = $("clis");
  const { data, error } = await sb.from("clientes").select("*").order("creado", { ascending: false });
  if (error) return errorConReintento(cont, "No se pudieron leer los clientes: " + error.message, () => cargarClientes(user));
  if (!data.length) { cont.innerHTML = "<p>Todavía no se registró nadie.</p>"; return; }
  cont.innerHTML = `<div class="scroll"><table class="tabla"><tr><th>Cliente</th><th>Estado</th><th>Aprobar como</th></tr>
    ${data.map(c => `<tr><td><b>${esc(c.razon_social)}</b><br>${esc(c.email)}<br>${esc([c.cuit, c.zona, c.telefono].filter(Boolean).join(" · "))}</td>
      <td><span class="pill ${({pendiente:"pend",aprobado:"apro",rechazado:"rech"})[c.estado]}">${esc(c.estado)}</span>${c.categoria ? "<br>" + esc(c.categoria === "ff" ? "Fly Free" : "Mayorista") : ""}</td>
      <td><div class="fila"><select data-id="${c.id}" aria-label="Categoría"><option value="mayorista">Mayorista</option><option value="ff"${c.categoria === "ff" ? " selected" : ""}>Fly Free</option></select>
      <button type="button" data-ap="${c.id}">Aprobar</button><button type="button" class="sec" data-re="${c.id}">Rechazar</button></div></td></tr>`).join("")}
    </table></div><div class="msg" id="mCli"></div>`;
  const cambiar = async (id, cambios, btn) => {
    btn.disabled = true;
    const { error } = await sb.from("clientes").update(cambios).eq("id", id);
    if (error) { btn.disabled = false; mostrar($("mCli"), "err", "No se pudo guardar: " + error.message + ". Tocá el botón de nuevo para reintentar."); return; }
    cargarClientes(user);
  };
  cont.querySelectorAll("[data-ap]").forEach(b => b.onclick = () =>
    cambiar(b.dataset.ap, { estado: "aprobado", categoria: cont.querySelector(`select[data-id="${b.dataset.ap}"]`).value }, b));
  cont.querySelectorAll("[data-re]").forEach(b => b.onclick = () => cambiar(b.dataset.re, { estado: "rechazado" }, b));
}

function pintar(session){
  $("fuera").classList.toggle("hide", !!session);
  $("dentro").classList.toggle("hide", !session);
  if (session) cargar(session.user);
}
if (sb) {
  sb.auth.onAuthStateChange((_ev, session) => setTimeout(() => pintar(session), 0));
}
</script>
</body>
</html>

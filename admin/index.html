<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel | Universo Sobre Ruedas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --paper:#F4F4F4; --card:#FFFFFF; --ink:#141414; --soft:#5E5E66; --line:#E2E2E2;
  --rs:#E8361B; --y:#FF7A1A; --ok:#0E9F6E; --head:#141414; --warn:#B45309;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --paper:#111113; --card:#1C1C20; --ink:#F2F2F4; --soft:#A6A6B0; --line:#2E2E34; --rs:#FF5A3C; --ok:#34D399; --head:#000000; --warn:#F5A524; }
}
:root[data-theme="dark"]{ --paper:#111113; --card:#1C1C20; --ink:#F2F2F4; --soft:#A6A6B0; --line:#2E2E34; --rs:#FF5A3C; --ok:#34D399; --head:#000000; --warn:#F5A524; }
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rs);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* encabezado */
.top{background:var(--head);color:#fff;border-bottom:6px solid var(--rs);padding:calc(14px + env(safe-area-inset-top,0px)) 0 14px}
.top .wrap{display:flex;align-items:center;gap:12px}
.top img{width:52px;height:52px;flex:0 0 auto}
.top .u{color:var(--rs);font-weight:800;letter-spacing:.3em;font-size:11px}
.top .s{font-weight:900;font-size:24px;line-height:1;font-stretch:85%}
.top .r{color:#B9B9C0;font-size:13px;display:flex;align-items:center;gap:8px;margin-top:2px}
.beta{background:var(--y);color:#111;font-weight:900;font-size:11px;letter-spacing:.06em;border-radius:999px;padding:2px 8px;white-space:nowrap}
.acts{margin-left:auto;display:flex;gap:8px;flex:0 0 auto}
.acts a,.acts button{height:40px;display:inline-flex;align-items:center;border-radius:12px;padding:0 14px;font-weight:900;font-size:14px;cursor:pointer;border:1.5px solid #fff;background:transparent;color:#fff;text-decoration:none;white-space:nowrap}
@media (max-width:560px){.top .r .t{display:none}.top img{width:42px;height:42px}.top .s{font-size:19px}.acts a,.acts button{height:36px;padding:0 10px;font-size:13px}.top .wrap{gap:9px}}
@media (max-width:400px){.acts a{display:none}}

/* solapas */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;position:relative;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 18px;font-weight:900;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab em{font-style:normal;background:var(--y);color:#111;border-radius:999px;min-width:22px;height:22px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.tab small{font-size:10px;font-weight:900;letter-spacing:.06em;color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:0 6px}
.tab[aria-selected="true"] small{color:inherit;border-color:currentColor}

/* títulos */
.hola{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 14px}
.hola h1{margin:0;font-weight:900;font-stretch:72%;font-size:clamp(40px,9vw,64px);line-height:.9}
.hola h1 .y{color:var(--y)}
.hola p{margin:6px 0 0;color:var(--soft);font-weight:700}
.kick{display:flex;align-items:center;gap:10px;margin:0 0 6px;color:var(--y);font-weight:800;letter-spacing:.12em;font-size:12px;white-space:nowrap}
.kick span{flex:0 0 24px;height:2px;background:var(--y)}
h2.sec{margin:26px 0 10px;font-weight:900;font-stretch:75%;font-size:30px;line-height:1;display:flex;align-items:center;gap:10px}
h2.sec::before{content:"";width:6px;height:24px;border-radius:3px;background:var(--y)}

/* números */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--c,var(--ok))}
.kpi .l{font-size:12px;font-weight:900;letter-spacing:.06em;color:var(--soft);text-transform:uppercase}
.kpi .n{font-weight:900;font-stretch:75%;font-size:46px;line-height:1;margin:6px 0 2px;color:var(--c,var(--ok))}
.kpis.fin{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.kpi .n.m{font-size:clamp(22px,2.2vw,30px);white-space:nowrap;margin:10px 0 4px}
.kpi .n.pron{font-size:22px;color:var(--soft);margin:12px 0 6px}
.kpi .d{font-size:14px;color:var(--soft);font-weight:600}
.kpi button{margin-top:10px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:800;padding:8px 12px;cursor:pointer}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.vacio{color:var(--soft);font-weight:700;text-align:center;padding:18px 10px}
.prox{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.prox .card b{display:block;font-size:20px;font-weight:900;font-stretch:80%}
.prox .card p{margin:4px 0 0;color:var(--soft);font-size:15px}
.prox .card .tag{display:inline-block;margin-top:10px;font-size:12px;font-weight:900;letter-spacing:.04em;color:var(--warn)}

/* clientes */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:800;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--rs);border-color:var(--rs);color:#fff}
.clis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.cli{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.cli .cab{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.cli h3{margin:0;font-size:24px;font-weight:900;font-stretch:78%;line-height:1.05;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli .dat{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.cli .dat span{color:var(--soft);font-weight:700}
.cli .dat b{min-width:0;overflow-wrap:anywhere}
.cli .dat b.nd{color:var(--soft);font-weight:600}
.cli .hist{margin-top:auto;border:2px solid var(--y);background:color-mix(in srgb,var(--y) 12%,var(--card));border-radius:14px;padding:10px 12px}
.cli .hist .ht{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--y);margin-bottom:6px}
.cli .hist .hs{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:8px}
.cli .hist .hn{min-height:2.6em}
.cli .hist .hs b{display:block;font-size:24px;font-weight:900;font-stretch:78%;line-height:1;color:var(--ink);white-space:nowrap}
.cli .hist .hs span{font-size:12px;font-weight:800;color:var(--soft)}
.cli .hist .hn{font-size:12.5px;font-weight:700;color:var(--soft);margin-top:6px}
.cli .acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.cli select{padding:9px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:800}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:900;cursor:pointer;background:var(--ok);color:#fff}
.btn.no{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:900;letter-spacing:.02em;white-space:nowrap}
.pill.pendiente{background:#FFF4D6;color:#8A5A00}.pill.aprobado{background:#E7F6EF;color:#06603F}.pill.rechazado{background:#FDECEC;color:#C62828}

/* precios */
.buscar{width:100%;max-width:420px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;margin-bottom:12px}
.modelo{margin-bottom:14px}
.modelo h3{margin:0 0 8px;font-size:26px;font-weight:900;font-stretch:75%;line-height:1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.modelo h3 small{font-size:14px;font-weight:700;color:var(--soft);font-stretch:100%}
.tabla{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10.5px;letter-spacing:.04em;color:var(--soft);font-weight:900;background:var(--paper);white-space:normal;vertical-align:bottom;line-height:1.2}
@media (max-width:899px){
  .tabla{border:0;background:none;overflow:visible}
  table,tbody,tr,td{display:block} thead{display:none}
  tr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-bottom:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px}
  td{border:0;padding:4px 0;display:flex;justify-content:space-between;align-items:baseline;gap:6px;text-align:right;white-space:normal;min-width:0;font-size:13px}
  td::before{content:attr(data-l);font-size:9.5px;font-weight:900;letter-spacing:.02em;color:var(--soft);text-align:left;line-height:1.15;min-width:0}
  td:first-child{grid-column:1/-1;font-size:16px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:2px}
  td:first-child::before{content:none}
}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
tr:last-child td{border-bottom:0}
td.costo{color:var(--soft)}
td.m{font-weight:900;color:var(--ok)}
td .neg{color:#C62828;font-weight:900}
td small{color:var(--soft);font-weight:700}
.nota{color:var(--soft);font-size:14px;font-weight:600;margin:0 0 12px}
.infob{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--y);border-radius:14px;padding:12px 16px;margin:0 0 14px;max-width:820px}
.infob ul{margin:0;padding-left:18px;font-size:15px;line-height:1.5;color:var(--ink)}
.infob li{margin:2px 0}
.perfiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:0 0 16px}
.pf{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--y);border-radius:14px;padding:12px 14px}
.pf>b{display:block;font-size:20px;font-weight:900;font-stretch:80%;margin-bottom:4px}
.pf ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.45;color:var(--ink)}
.pf li{margin:2px 0}

/* login y mensajes */
.login{max-width:440px;margin:40px auto}
.login h1{margin:0 0 4px;font-weight:900;font-stretch:72%;font-size:48px;line-height:.9}
.login label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--soft);margin-top:10px}
.login input{padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:16px}
.big{width:100%;height:56px;border:0;border-radius:14px;font-weight:900;font-size:17px;cursor:pointer;margin-top:14px;background:var(--rs);color:#fff}
.big:disabled{opacity:.5}
.err{background:#FDECEC;color:#C62828;border:1px solid #F5B5B5;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;margin-top:10px}
.err button{border:0;background:#C62828;color:#fff;border-radius:8px;padding:6px 10px;font-weight:800;cursor:pointer;margin-left:6px}
.peds{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.ped{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ped .pc{display:flex;justify-content:space-between;gap:8px;width:100%;align-items:flex-start}
.ped .pc>div{min-width:0}
.ped .pc>div>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.ped .pc>div>span.zn{margin-top:0;font-weight:600}
.ped .pc b{display:block;font-size:24px;font-weight:900;font-stretch:78%;line-height:1}
.ped .pc>div>span{color:var(--soft);font-weight:700;font-size:14px}
.ped .pn{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;width:100%}
.ped .pn b{display:block;font-size:17px;font-weight:900;white-space:nowrap}
.ped .pn span{font-size:12px;font-weight:800;color:var(--soft)}
.ped .pnota{min-height:6.2em;margin:0;font-size:13.5px;color:var(--soft);font-weight:600;background:var(--paper);border-radius:10px;padding:8px 10px;width:100%}
.ped>button{margin-top:auto}
.pdet{width:100%;border-top:1px solid var(--line);padding-top:6px}
.pdet div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.stk{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));margin-top:14px}
.stk h3{margin:0 0 8px;font-size:22px;font-weight:900;font-stretch:78%;display:flex;justify-content:space-between;align-items:baseline}
.stk h3 small{font-size:13px;color:var(--ok);font-stretch:100%}
table.mini{min-width:0;font-size:14px;display:table;width:100%}
table.mini th,table.mini td{display:table-cell;padding:5px 6px}
table.mini thead{display:table-header-group} table.mini tbody{display:table-row-group} table.mini tr{display:table-row;background:none;border:0;padding:0;margin:0}
table.mini td::before{content:none}
table.mini th,table.mini td{border-bottom:1px solid var(--line);margin:0;font-size:14px;grid-column:auto}
table.mini th{font-size:10.5px}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini th:nth-child(n+2),table.mini td:nth-child(n+2){text-align:right}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 24px}
.sheet.show{display:flex}
.sheet .panel{background:var(--paper);width:100%;max-width:720px;max-height:100%;overflow:auto;border-radius:22px;padding:20px 16px;position:relative}
.sheet .x{position:absolute;right:12px;top:8px;border:0;background:transparent;font-size:32px;cursor:pointer;color:var(--soft);line-height:1}
.pcab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-right:30px}
.pcab h3{margin:0;font-size:38px;font-weight:900;font-stretch:72%;line-height:.95}
.pinfo{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
.pinfo span{display:block;font-size:11px;font-weight:900;letter-spacing:.05em;color:var(--soft);text-transform:uppercase}
.pinfo b{font-size:15px}
.pgr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.pgh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.pgh b{font-size:20px;font-weight:900;font-stretch:80%}
.pgh span{font-size:14px;font-weight:800;color:var(--soft)}
.ptot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:12px 0}
.ptot div{display:flex;justify-content:space-between;padding:5px 0;font-size:15px}
.ptot div span{color:var(--soft);font-weight:700}
.ptot .g{background:var(--rs);color:#fff;border-radius:10px;padding:10px 12px;margin-top:6px;font-size:19px}
.ptot .g span{color:#fff;font-weight:900}
.gform{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.gform>b{font-size:18px;font-weight:900}
.gcampos{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.gcampos label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--soft)}
.gcampos input,.gcampos select{padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;font-size:15px;color:var(--ink)}
.gform .btn{align-self:flex-start}
.gl{display:flex;flex-direction:column;gap:8px}
.gi{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid #C62828;border-radius:12px;padding:10px 12px}
.gi>div{min-width:0}
.gi b{display:block}
.gi span{font-size:13px;color:var(--soft);font-weight:700}
.gi .gm{font-size:18px;white-space:nowrap}
.invs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.inv{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--y);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.inv b{font-size:22px;font-weight:900;font-stretch:80%}
.inv .iv{font-size:28px;font-weight:900;font-stretch:78%}
.inv .ib{height:8px;border-radius:99px;background:var(--paper);overflow:hidden}
.inv .ib span{display:block;height:100%;background:var(--y)}
.inv>span{font-size:13px;font-weight:700;color:var(--soft)}
.inv.sa{border-top-color:var(--soft)}
.inv.sa .ib span{background:var(--soft)}
.pago{width:100%;border-radius:10px;padding:7px 10px;font-size:14px;font-weight:800}
.pago.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}
.pago.parcial{background:color-mix(in srgb,var(--y) 16%,var(--card));color:var(--y)}
.pago.no{background:var(--paper);color:var(--soft)}
.pbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.pbox>b{font-size:18px;font-weight:900}
.estados{display:flex;flex-wrap:wrap;gap:6px}
.est{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 12px;font-weight:800;font-size:14px;cursor:pointer}
.est.on{background:var(--ok);border-color:var(--ok);color:#fff}
.plist div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.plist span{color:var(--soft);font-weight:700}
.psaldo{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:var(--soft);font-weight:700}
.psaldo b{color:var(--ink)}
.sub0{margin:0;color:var(--soft);font-weight:700;font-size:14px}
#fPago .btn{align-self:end}
footer{color:var(--soft);font-size:13px;font-weight:700;text-align:center;padding:30px 0 40px}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <img id="logo" alt="Universo Sobre Ruedas">
  <div><div class="u">UNIVERSO</div><div class="s">SOBRE RUEDAS</div><div class="r"><span class="t">Panel de administración</span><span class="beta">BETA 1.8</span></div></div>
  <div class="acts"><a href="../">Ver página</a><button type="button" id="salir" hidden>Salir</button></div>
</div></div>

<!-- Ingresar -->
<main class="wrap" id="vLogin" hidden>
  <form class="login card" id="fIng" novalidate>
    <p class="kick"><span></span>SOLO ADMINISTRACIÓN<span></span></p>
    <h1>INGRESAR</h1>
    <label>Usuario o mail<input id="iMail" type="text" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="admin"></label>
    <label>Contraseña<input id="iPass" type="password" required autocomplete="current-password"></label>
    <button class="big" id="iGo" type="submit">Ingresar</button>
    <div id="iMsg"></div>
  </form>
</main>

<!-- Sin permiso -->
<main class="wrap" id="vNo" hidden>
  <div class="login card"><h1>SIN ACCESO</h1><p>Esta cuenta no es administradora. <a href="../">Volver a la página</a>.</p></div>
</main>

<!-- Panel -->
<div id="vPanel" hidden>

function ver(v){ ["vLogin","vNo","vPanel","vCarga"].forEach(id=>$("#"+id).hidden=id!==v); $("#salir").hidden=v==="vLogin"||v==="vCarga"; }

/* ===== sesión ===== */
$("#fIng").addEventListener("submit",async ev=>{
  ev.preventDefault(); const m=$("#iMsg"); m.innerHTML="";
  if(!sb){ m.innerHTML='<div class="err">No se pudo conectar. Revisá internet y recargá la página.</div>'; return; }
  const b=$("#iGo"); b.disabled=true; b.textContent="Ingresando…";
  try{ const {error}=await sb.auth.signInWithPassword({email:usuario($("#iMail").value),password:$("#iPass").value}); if(error) throw error; }
  catch(e){ m.innerHTML=errHTML("No se pudo ingresar: "+traducir(e.message||String(e))); m.querySelector("[data-reint]").onclick=()=>$("#fIng").requestSubmit(); }
  finally{ b.disabled=false; b.textContent="Ingresar"; }
});
$("#salir").addEventListener("click",async()=>{ const {error}=await sb.auth.signOut(); if(error) alert("No se pudo salir: "+error.message); });

async function entrar(user){
  S.user=user; ver("vCarga");
  const {data,error}=await sb.from("admins").select("user_id").eq("user_id",user.id);
  if(error){ $("#vCarga").innerHTML=errHTML("No se pudo verificar tu cuenta: "+traducir(error.message)); $("#vCarga [data-reint]").onclick=()=>entrar(user); return; }
  if(!data.length){ ver("vNo"); return; }
  ver("vPanel"); pintar();
  cargarClientes(); cargarProductos(); cargarCompras(); cargarPedidos(); cargarStock(); cargarFinanzas();
}
/* Historial: pares y $ de las ventas (no canceladas) de cada cliente */
async function cargarCompras(){
  const {data,error}=await sb.from("operaciones").select("cliente_id,total,estado,operacion_items(cantidad)").eq("tipo","venta").neq("estado","cancelada");
  if(error){ S.err.compras=traducir(error.message); pintar(); return; }
  S.err.compras=null; S.compras={};
  (data||[]).forEach(o=>{ if(!o.cliente_id) return; const h=S.compras[o.cliente_id]=S.compras[o.cliente_id]||{pedidos:0,pares:0,total:0};
    h.pedidos++; h.total+=Number(o.total)||0; h.pares+=(o.operacion_items||[]).reduce((a,i)=>a+i.cantidad,0); });
  pintar();
}
async function cargarClientes(){
  S.err.clientes=null;
  const {data,error}=await sb.from("clientes").select("*").order("creado",{ascending:false});
  if(error){ S.err.clientes=traducir(error.message); } else { S.clientes=data; S.yo=data.find(c=>c.user_id===S.user.id)||null; }
  pintar();
}
async function cargarProductos(){
  S.err.productos=null;
  const {data,error}=await sb.from("productos").select("*").order("modelo").order("sku");
  if(error) S.err.productos=traducir(error.message); else S.productos=data;
  pintar();
}

/* ===== dibujo ===== */
const pend=()=>(S.clientes||[]).filter(c=>c.estado==="pendiente");
function pintar(){
  $("#tabs").innerHTML=TABS.map(t=>`<button class="tab" role="tab" data-t="${t.k}" aria-selected="${t.k===S.tab}">${t.i} ${t.n}${t.k==="clientes"&&pend().length?`<em>${pend().length}</em>`:""}${t.prox?"<small>PRONTO</small>":""}</button>`).join("");
  const f={inicio,clientes,precios,pedidos,stock,finanzas}[S.tab];
  $("#cont").innerHTML=f();
  $("#cont").querySelectorAll("[data-reint-compras]").forEach(b=>b.onclick=cargarCompras);
  $("#cont").querySelectorAll("[data-reint]").forEach(b=>b.onclick=({productos:cargarProductos,pedidos:cargarPedidos,stock:cargarStock,fin:cargarFinanzas})[b.closest("[data-carga]")?.dataset.carga]||cargarClientes);
}
const cargando=(k,fn)=>S.err[k]?`<div data-carga="${k}">${errHTML("No se pudieron cargar los datos: "+S.err[k])}</div>`:(k==="clientes"?S.clientes:S.productos)==null?`<p class="vacio">Cargando…</p>`:fn();

  const fecha=new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
  const c=S.clientes||[], ap=c.filter(x=>x.estado==="aprobado").length, p=pend().length;
  const prods=S.productos?new Set(S.productos.map(x=>x.modelo)).size:null;

    <div class="kpi"><div class="l">Clientes aprobados</div><div class="n">${S.clientes?ap:"…"}</div><div class="d">Ven precios en la página</div></div>
    <div class="kpi" style="--c:var(--ink)"><div class="l">Lista de precios</div><div class="n">${prods??"…"}</div><div class="d">modelos · ${S.productos?S.productos.length+" códigos":"…"}</div><button data-ir="precios">Ver precios</button></div>
    <div class="kpi" style="--c:var(--y)"><div class="l">Pedidos por confirmar</div><div class="n">${S.pedidos?S.pedidos.filter(o=>o.estado==="nueva"||o.estado==="a_confirmar").length:"…"}</div><div class="d">${S.pedidos?S.pedidos.length+" pedidos en total":"…"}</div><button data-ir="pedidos">Ver pedidos</button></div>
  </div>
  ${p?`<h2 class="sec">Para aprobar</h2><div class="clis">${pend().slice(0,3).map(cliHTML).join("")}</div>`:""}
  <h2 class="sec">Lo que viene</h2>
  <div class="prox">
    <div class="card"><b>📦 Pedidos desde la página</b><p>Que cada "Hacer pedido" quede guardado con su número, reserve el stock y te avise por mail.</p><span class="tag">PRÓXIMO PASO</span></div>
    <div class="card"><b>📊 Stock de los depósitos</b><p>Lo que hay hoy en SR, Fly Free y La Plata, valorizado a costo.</p><span class="tag">FALTA EL STOCK REAL</span></div>
    <div class="card"><b>💰 Finanzas</b><p>Cuentas corrientes, lo que se le debe al proveedor, caja, Mercado Pago y resultado del mes.</p><span class="tag">FALTA CARGAR EL HISTORIAL</span></div>
  </div>`;
}
function histHTML(c){
  const t=`<div class="ht">📊 HISTORIAL DE COMPRAS</div>`;
  if(S.err.compras) return t+`<div class="hn">⚠️ No se pudo leer el historial <button class="btn no" data-reint-compras>🔄 Reintentar</button></div>`;
  const h=S.compras[c.id]||{pares:0,total:0,pedidos:0};
  return t+`<div class="hs"><div><b>${h.pares}</b><span>${h.pares===1?"par":"pares"}</span></div><div><b>${fmt(h.total)}</b><span>invertido</span></div><div><b>${h.pedidos}</b><span>${h.pedidos===1?"pedido":"pedidos"}</span></div></div>
    <div class="hn">${h.pedidos?`Suma de sus pedidos, sin los cancelados.`:`Todavía no hay compras guardadas. Se llena cuando los pedidos queden registrados.`}</div>`;
}
function cliHTML(c){
  return `<div class="cli"><div class="cab"><h3 title="${esc(c.razon_social)}">${esc(c.razon_social)}</h3><span class="pill ${esc(c.estado)}">${c.estado==="aprobado"?"APROBADO · "+(PERFIL[c.categoria]||"Mayorista").toUpperCase():esc(c.estado.toUpperCase())}</span></div>
    <div class="dat">${[["Mail",c.email],["CUIT",c.cuit],["Contacto",c.contacto],["Teléfono",c.telefono],["Zona",c.zona],["Dirección",c.direccion]].map(([k,v])=>`<span>${k}</span><b class="${v?"":"nd"}">${v?esc(v):"—"}</b>`).join("")}
      <span>Alta</span><b>${new Date(c.creado).toLocaleDateString("es-AR")}</b></div>
    <div class="hist">${histHTML(c)}</div>
    ${c.estado==="aprobado"&&S.editando!==c.id?`<div class="acc"><button class="btn no" data-ed="${c.id}">✏️ Cambiar perfil</button>${S.compras[c.id]?`<button class="btn" data-pc="${c.id}">📦 Ver sus pedidos</button>`:""}</div>`
    :`<div class="acc"><select data-cat="${c.id}" aria-label="Perfil de ${esc(c.razon_social)}">${Object.entries(PERFIL).map(([k,v])=>`<option value="${k}"${(c.categoria||"mayorista")===k?" selected":""}>Perfil ${v}</option>`).join("")}</select>
      <button class="btn" data-ap="${c.id}">${c.estado==="aprobado"?"Guardar":"Aprobar"}</button>${c.estado!=="rechazado"?`<button class="btn no" data-re="${c.id}">Rechazar</button>`:""}${c.estado==="aprobado"?`<button class="btn no" data-ed="">Cancelar</button>`:""}</div>`}
    <div data-m="${c.id}"></div></div>`;
}
function clientes(){
  return `<div class="hola"><div><p class="kick"><span></span>CLIENTES<span></span></p><h1>CLIEN<span class="y">TES</span></h1><p>Aprobá a cada comercio y elegí su perfil.</p></div></div>
  <div class="perfiles">
    <div class="pf"><b>Mayorista China</b><ul><li>🚚 Llega 28/10 y 📦 Encargo</li><li>Precio <b>China</b></li><li>Por <b>caja cerrada</b> con la curva completa de talles</li><li>Se suma el IVA</li></ul></div>
    <div class="pf"><b>Mayorista BA</b><ul><li>⚡ Entrega inmediata desde el <b>Depo BA</b></li><li>Precio <b>Depo BA</b></li><li>Mínimo <b>6 unidades</b></li><li>Se suma el IVA</li></ul></div>
    <div class="pf"><b>Emprendedor</b><ul><li>Precio <b>China + 30 %</b> en todo</li><li>Se suma el IVA</li><li>Mínimo <b>3 pares</b> por pedido</li></ul></div>
    <div class="pf"><b>Fly Free</b><ul><li>Precio <b>Fly Free</b> en todo</li><li>Sin mínimo</li></ul></div>
  </div>`
  +cargando("clientes",()=>{

      ${l.length?`<div class="clis">${l.map(cliHTML).join("")}</div>`:`<div class="card vacio">${{pendiente:"No hay clientes esperando aprobación. 👍",aprobado:"Todavía no aprobaste a ningún cliente.",rechazado:"No hay clientes rechazados.",todos:"Todavía no se registró nadie."}[filtro]}</div>`}`;

function precios(){
  return `<div class="hola"><div><p class="kick"><span></span>LISTA DE PRECIOS<span></span></p><h1>PRE<span class="y">CIOS</span></h1></div></div>
  <div class="infob"><ul>
    <li><b>Emprendedor</b> = China + 30 %.</li>
    <li><b>Nuestro margen</b> = lo que gana Sobre Ruedas sobre el costo.</li>
    <li><b>Nuestra venta en ML</b> = lo que ganamos vendiendo al por menor en Mercado Libre: precio público con IVA, menos el 25 % de ML, menos el costo.</li>
  </ul></div>`
  +cargando("productos",()=>{
    const q=S.buscar.trim().toUpperCase();
    const l=S.productos.filter(p=>!q||(p.sku+" "+p.modelo+" "+(MODELOS[p.modelo]||"")).toUpperCase().includes(q));
    const grupos={}; l.forEach(p=>(grupos[p.modelo]=grupos[p.modelo]||[]).push(p));
    const mg=(v,c)=>c?pct((v-c)/c*100):"—";
    return `<input class="buscar" id="buscar" type="search" placeholder="Buscar modelo o código (ej: RSJ, M4PRO)" value="${esc(S.buscar)}" aria-label="Buscar">
      ${Object.keys(grupos).length?Object.entries(grupos).map(([m,ps])=>`<div class="modelo"><h3>${esc(MODELOS[m]||m)} <small>${ps.length} ${ps.length===1?"código":"códigos"} · colores ${esc([...new Set(ps.map(p=>p.color))].join(", "))}</small></h3>
        <div class="tabla"><table><thead><tr>${COLS.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>
        ${ps.map(p=>{ const em=Math.round(p.precio_china*1.3), v=[`<b>${esc(p.sku)}</b>`,esc(p.talle||"—"),fmt(p.costo),fmt(p.precio_ff),fmt(p.precio_china),fmt(p.precio_ba),fmt(em),fmt(p.precio_publico_iva??(p.precio_publico&&p.precio_publico*1.21)),mg(p.precio_china,p.costo),mg(p.precio_ba,p.costo),mg(em,p.costo),(()=>{ const pi=p.precio_publico_iva??(p.precio_publico&&p.precio_publico*1.21), g=pi?pi*(1-ML_COMISION)-p.costo:null; return g==null?"—":`<span class="${g<0?"neg":""}">${fmt(g)} <small>(${Math.round(g/p.costo*100)}%)</small></span>`; })()];
          return `<tr>${v.map((x,i)=>`<td data-l="${COLS[i]}" class="${i===2?"costo":i>=8&&i<=10?"m":""}">${x}</td>`).join("")}</tr>`; }).join("")}
        </tbody></table></div></div>`).join(""):`<div class="card vacio">No hay productos con “${esc(S.buscar)}”.</div>`}`;
  });
}
/* ===== pedidos (ventas) ===== */
const NOMBRE={"RS600|B":"RS600 Camuflado","M4PRO|N":"M4 PRO Negro","M4PRO|M":"M4 PRO Morado","M3|G":"M3 Blanco","RS300|T":"RS300 Turquesa","RX6D|B":"RX6 Blanco","RX6D|N":"RX6D Negro","RSJ|V":"RSJ Violeta","RSJ|R":"RSJ Rosa","RSJ|A":"RSJ Azul","RSK|T":"RSK Beige y celeste","MAX|R":"MAX Rosa","CELIGHT|N":"Casco CE Light","PROTECCION|RS":"Protecciones RS"};
const nombreDe=p=>p?(NOMBRE[p.modelo+"|"+p.color]||(MODELOS[p.modelo]||p.modelo)+" "+p.color):"";
const ESTADO={nueva:["Nueva","pendiente"],a_confirmar:["A confirmar","pendiente"],confirmada:["Confirmada","aprobado"],preparada:["Preparada","aprobado"],entregada:["Entregada","aprobado"],cancelada:["Cancelada","rechazado"]};
const MEDIO={transferencia:"Transferencia",mp:"Mercado Pago",efectivo:"Efectivo",usd:"Dólares",cheque:"Cheque"};
const MODO={ya:"⚡ Depo BA",via:"🚚 Llega 28/10",enc:"📦 Encargo"};
async function cargarPedidos(){
  const {data,error}=await sb.from("operaciones").select("id,cliente_id,fecha,total,estado,numero_proforma,modo,canal,notas,clientes(razon_social,zona,contacto,telefono,email),operacion_items(sku,cantidad,precio_unitario,modo,productos(modelo,color,talle)),pagos(id,fecha,monto,medio,notas)").eq("tipo","venta").order("fecha",{ascending:false});
  if(error){ S.err.pedidos=traducir(error.message); pintar(); return; }
  S.err.pedidos=null; S.pedidos=data; pintar();
}
/* "25.000" · "25000" · "7.947.703,50" · "7947703.5" → número */
const parseMonto=v=>{ v=String(v).trim().replace(/\$|\s/g,""); if(v.includes(",")) v=v.replace(/\./g,"").replace(",","."); else if(!/^\d+\.\d{1,2}$/.test(v)) v=v.replace(/\./g,""); return Number(v); };
const pagadoDe=o=>(o.pagos||[]).reduce((a,p)=>a+Number(p.monto),0);
const tituloPed=o=>o.numero_proforma?"Proforma "+String(o.numero_proforma).padStart(5,"0"):"Pedido #"+o.id;
function pedidos(){
  return `<div class="hola"><div><p class="kick"><span></span>PEDIDOS<span></span></p><h1>PEDI<span class="y">DOS</span></h1><p>Las órdenes de cada cliente con su estado. Tocá <b>Ver pedido</b> para ver el desglose completo.</p></div></div>`
  +(S.pedCli&&S.pedidos?`<div class="chips"><span class="chip" aria-pressed="true">Cliente: ${esc((S.clientes||[]).find(c=>c.id===S.pedCli)?.razon_social||"—")}</span><button class="chip" data-pc="">✕ Ver todos los pedidos</button></div>`:"")
  +(S.err.pedidos?`<div data-carga="pedidos">${errHTML("No se pudieron leer los pedidos: "+S.err.pedidos)}</div>`:S.pedidos==null?`<p class="vacio">Cargando…</p>`
  :!S.pedidos.length?`<div class="card vacio">Todavía no hay pedidos guardados.</div>`
  :`<div class="peds">${S.pedidos.filter(o=>!S.pedCli||o.cliente_id===S.pedCli).map(o=>{ const its=o.operacion_items||[], pares=its.reduce((a,i)=>a+i.cantidad,0), [et,ec]=ESTADO[o.estado]||[o.estado||"—","pendiente"], ab=S.abierto===o.id;
    return `<div class="ped"><div class="pc"><div><b>${tituloPed(o)}</b><span>${esc(o.clientes?.razon_social||"—")}</span><span class="zn">${esc(o.clientes?.zona||"—")}</span></div><span class="pill ${ec}">${esc(et.toUpperCase())}</span></div>
      <div class="pn"><div><b>${new Date(o.fecha+"T12:00").toLocaleDateString("es-AR")}</b><span>fecha</span></div><div><b>${pares}</b><span>pares</span></div><div><b>${fmtc(o.total)}</b><span>total</span></div><div><b>${esc(MODO[o.modo]||(o.canal||"—"))}</b><span>entrega</span></div></div>
      <div class="pago ${pagadoDe(o)>=Number(o.total)-0.5?"ok":pagadoDe(o)>0?"parcial":"no"}">${pagadoDe(o)>=Number(o.total)-0.5?"✅ Pagado":pagadoDe(o)>0?`💵 Pagó ${fmtc(pagadoDe(o))} · debe ${fmtc(Number(o.total)-pagadoDe(o))}`:`⏳ Sin pagos registrados · debe ${fmtc(o.total)}`}</div>
      ${o.notas?`<p class="pnota">${esc(o.notas)}</p>`:""}
      <button class="btn" data-ver="${o.id}">🔍 Ver pedido</button>
    </div>`; }).join("")}</div>`);
}
function verPedido(id){
  const o=(S.pedidos||[]).find(x=>x.id===id); if(!o) return;
  const its=o.operacion_items||[], grupos={};
  its.forEach(i=>{ const k=nombreDe(i.productos); (grupos[k]=grupos[k]||[]).push(i); });
  const pares=its.reduce((a,i)=>a+i.cantidad,0), sub=its.reduce((a,i)=>a+i.cantidad*i.precio_unitario,0), iva=Number(o.total)-sub, [et,ec]=ESTADO[o.estado]||[o.estado||"—","pendiente"];
  const orden=t=>parseInt(t)||({S:1,M:2,L:3,XL:4,PLUS:0})[t]||0;
  $("#pedB").innerHTML=`<div class="pcab"><div><p class="kick"><span></span>${esc(MODO[o.modo]||o.canal||"PEDIDO")}<span></span></p><h3>${tituloPed(o)}</h3></div><span class="pill ${ec}">${esc(et.toUpperCase())}</span></div>
    <div class="pinfo"><div><span>Cliente</span><b>${esc(o.clientes?.razon_social||"—")}</b></div><div><span>Zona</span><b>${esc(o.clientes?.zona||"—")}</b></div>
      <div><span>Fecha</span><b>${new Date(o.fecha+"T12:00").toLocaleDateString("es-AR")}</b></div><div><span>Contacto</span><b>${esc([o.clientes?.contacto,o.clientes?.telefono].filter(Boolean).join(" · ")||"—")}</b></div></div>
    ${Object.entries(grupos).sort().map(([k,l])=>{ const n=l.reduce((a,i)=>a+i.cantidad,0), t=l.reduce((a,i)=>a+i.cantidad*i.precio_unitario,0);
      return `<div class="pgr"><div class="pgh"><b>${esc(k)}</b><span>${n} ${n===1?"par":"pares"} · ${fmtc(t)}</span></div>
        <table class="mini"><thead><tr><th>TALLE</th><th>CANT.</th><th>PRECIO</th><th>SUBTOTAL</th></tr></thead><tbody>
        ${[...l].sort((a,b)=>orden(a.productos?.talle)-orden(b.productos?.talle)||a.precio_unitario-b.precio_unitario).map(i=>`<tr><td>${esc(i.productos?.talle||"—")}</td><td>${i.cantidad}</td><td>${i.precio_unitario?fmtc(i.precio_unitario):"Sin cargo"}</td><td>${fmtc(i.cantidad*i.precio_unitario)}</td></tr>`).join("")}
        </tbody></table></div>`; }).join("")}
    <div class="ptot"><div><span>Total de pares</span><b>${pares}</b></div><div><span>Subtotal</span><b>${fmtc(sub)}</b></div>
      ${Math.abs(iva)>=1?`<div><span>IVA</span><b>${fmtc(iva)}</b></div>`:""}<div class="g"><span>TOTAL</span><b>${fmtc(o.total)}</b></div></div>
    ${o.notas?`<p class="pnota">${esc(o.notas)}</p>`:""}
    <div class="pbox"><b>Estado del pedido</b><div class="estados">${Object.entries(ESTADO).map(([k,[t]])=>`<button type="button" class="est${k===o.estado?" on":""}" data-est="${k}" data-id="${o.id}">${t}</button>`).join("")}</div><div id="estMsg"></div></div>
    <div class="pbox"><b>Pagos</b>
      ${(o.pagos||[]).length?`<div class="plist">${o.pagos.map(p=>`<div><span>${new Date(p.fecha+"T12:00").toLocaleDateString("es-AR")} · ${esc(MEDIO[p.medio]||p.medio)}${p.notas?" · "+esc(p.notas):""}</span><b>${fmtc(p.monto)}</b></div>`).join("")}</div>`:`<p class="sub0">Todavía no hay pagos registrados.</p>`}
      <div class="psaldo"><span>Pagado <b>${fmtc(pagadoDe(o))}</b></span><span>Debe <b>${fmtc(Math.max(0,Number(o.total)-pagadoDe(o)))}</b></span></div>
      <form id="fPago" data-id="${o.id}" novalidate class="gcampos">
        <label>Fecha<input type="date" name="fecha" value="${esc((S.pagoForm&&S.pagoForm.id===o.id?S.pagoForm.fecha:"")||new Date().toISOString().slice(0,10))}"></label>
        <label>Monto ($)<input name="monto" inputmode="decimal" value="${esc(S.pagoForm&&S.pagoForm.id===o.id?S.pagoForm.monto:fmtc(Math.max(0,Number(o.total)-pagadoDe(o))).replace("$ ",""))}"></label>
        <label>Cómo pagó<select name="medio">${Object.entries(MEDIO).map(([k,v])=>`<option value="${k}"${(S.pagoForm&&S.pagoForm.id===o.id?S.pagoForm.medio:"transferencia")===k?" selected":""}>${v}</option>`).join("")}</select></label>
        <label>Nota<input name="notas" value="${esc(S.pagoForm&&S.pagoForm.id===o.id?S.pagoForm.notas:"")}" placeholder="Ej: seña"></label>
        <button class="btn" type="submit" id="pGo">💵 Registrar pago</button>
      </form><div id="pMsg"></div>
    </div>`;
  $("#pedS").classList.add("show");
}
/* ===== finanzas: resultado, inversión y gastos ===== */
async function cargarFinanzas(){
  const {data,error}=await sb.from("operaciones").select("id,tipo,fecha,estado,total,moneda,modo,contraparte,canal,notas,operacion_items(cantidad,precio_unitario,productos(costo))").in("tipo",["venta","compra","gasto","aporte_capital"]).order("fecha",{ascending:false});
  if(error){ S.err.fin=traducir(error.message); pintar(); return; }
  S.err.fin=null; S.fin=data; pintar();
}
const ivaDe=o=>{ const sub=(o.operacion_items||[]).reduce((a,i)=>a+i.cantidad*i.precio_unitario,0); return {sub,costo:(o.operacion_items||[]).reduce((a,i)=>a+i.cantidad*(i.productos?.costo||0),0),pares:(o.operacion_items||[]).reduce((a,i)=>a+i.cantidad,0)}; };
function finanzas(){
  const h=`<div class="hola"><div><p class="kick"><span></span>FINANZAS<span></span></p><h1>FINAN<span class="y">ZAS</span></h1><p>Lo vendido, lo que ganamos y los gastos.</p></div></div>`;
  if(S.err.fin) return h+`<div data-carga="fin">${errHTML("No se pudieron leer las finanzas: "+S.err.fin)}</div>`;
  if(S.fin==null) return h+`<p class="vacio">Cargando…</p>`;
  const ventas=S.fin.filter(o=>o.tipo==="venta"&&o.estado!=="cancelada");
  const hechas=ventas.filter(o=>o.estado==="entregada"||o.estado==="confirmada"||o.estado==="preparada"), aConf=ventas.filter(o=>!hechas.includes(o));
  const sum=(l,f)=>l.reduce((a,o)=>a+f(o),0);
  const vSub=sum(hechas,o=>Number(o.total)), vCosto=sum(hechas,o=>ivaDe(o).costo), vPares=sum(hechas,o=>ivaDe(o).pares), bruta=vSub-vCosto;
  const gastos=S.fin.filter(o=>o.tipo==="gasto"), gTot=sum(gastos,o=>Number(o.total)), neta=bruta-gTot;
  const cSub=sum(aConf,o=>Number(o.total)), cGan=cSub-sum(aConf,o=>ivaDe(o).costo);
  const compras=S.fin.filter(o=>o.tipo==="compra"), comARS=compras.filter(o=>o.moneda!=="USD"), comUSD=compras.filter(o=>o.moneda==="USD");
  const imp=comUSD.reduce((a,o)=>a+Number(o.total),0), aportes=S.fin.filter(o=>o.tipo==="aporte_capital"), apTot=sum(aportes,o=>Number(o.total)), sinAsig=imp-apTot;
  // recuperado de la importación: ventas del stock que trajo (todo lo que no es "llega 28/10"), sin IVA, contra la inversión pasada a pesos
  const recV=sum(hechas.filter(o=>o.modo!=="via"),o=>Number(o.total)), recP=imp?recV/(imp*TC_REF)*100:0;
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
  const f=S.gastoForm||{fecha:new Date().toISOString().slice(0,10),concepto:"",proveedor:"",medio:"Mercado Pago",monto:""};
  return h+`<h2 class="sec">📈 Resultado</h2>
    <div class="kpis fin">
      <div class="kpi" style="--c:var(--ink)"><div class="l">Vendido</div><div class="n m">${fmt(vSub)}</div><div class="d">${vPares} pares · total cobrado (con IVA si corresponde) · pedidos confirmados y entregados</div></div>
      <div class="kpi" style="--c:var(--soft)"><div class="l">Costo de lo vendido</div><div class="n m">${fmt(vCosto)}</div><div class="d">a costo de la lista de precios</div></div>
      <div class="kpi"><div class="l">Ganancia bruta</div><div class="n m">${fmt(bruta)}</div><div class="d">${pct(bruta,vSub)} de lo vendido</div></div>
      <div class="kpi" style="--c:#C62828"><div class="l">Gastos</div><div class="n m">${fmt(gTot)}</div><div class="d">${gastos.length} ${gastos.length===1?"gasto":"gastos"}</div></div>
      <div class="kpi" style="--c:var(--y)"><div class="l">Ganancia neta</div><div class="n m">${fmt(neta)}</div><div class="d">ganancia bruta − gastos</div></div>
    </div>
    ${aConf.length?`<div class="infob" style="margin-top:12px"><ul><li>Además hay <b>${aConf.length} ${aConf.length===1?"pedido":"pedidos"} a confirmar</b> por ${fmt(cSub)}, que dejarían <b>${fmt(cGan)}</b> de ganancia bruta. No están sumados arriba: confirmalo desde el pedido.</li></ul>${aConf.map(o=>`<button class="btn no" style="margin-top:8px" data-ver-fin="${o.id}">🔍 Ver ${aConf.length===1?"el pedido":"pedido #"+o.id}</button>`).join(" ")}</div>`:""}
    <h2 class="sec">💼 Inversión</h2>
    <div class="kpis fin">
      <div class="kpi" style="--c:var(--ink)"><div class="l">Importación 04/2026</div><div class="n m">USD ${usd(imp)}</div><div class="d">198 rollers · ≈ ${fmt(imp*TC_REF)}</div></div>
      <div class="kpi" style="--c:var(--ok)"><div class="l">Recuperado de la importación</div><div class="n m">${Math.round(recP)}%</div><div class="d">${fmt(recV)} vendidos · ${recP>=100?"✅ ya se recuperó":"falta "+fmt(imp*TC_REF-recV)}</div></div>
      ${comARS.map(o=>`<div class="kpi" style="--c:var(--soft)"><div class="l">Pedido del ${new Date(o.fecha+"T12:00").toLocaleDateString("es-AR")}</div><div class="n m">${fmt(o.total)}</div><div class="d">llega 28/10</div></div>`).join("")}
    </div>
    <h2 class="sec">🤝 Inversores</h2>
    <div class="invs">${aportes.map(o=>`<div class="inv"><b>${esc(o.contraparte)}</b><div class="iv">USD ${usd(o.total)}</div><div class="ib"><span style="width:${(Number(o.total)/imp*100).toFixed(1)}%"></span></div><span>${(Number(o.total)/imp*100).toFixed(1).replace(".",",")}% de la importación</span></div>`).join("")}
      ${sinAsig>0.5?`<div class="inv sa"><b>Sin asignar</b><div class="iv">USD ${usd(sinAsig)}</div><div class="ib"><span style="width:${(sinAsig/imp*100).toFixed(1)}%"></span></div><span>Falta aclarar quién lo puso</span></div>`:""}
    </div>
    <div class="infob" style="margin-top:12px"><ul><li>Total puesto: <b>USD ${usd(apTot)}</b> de USD ${usd(imp)}.</li><li>Para pasar los dólares a pesos uso <b>$ ${TC_REF.toLocaleString("es-AR",{maximumFractionDigits:0})} por dólar</b> (lo que salió el pago de USD 4.256 de septiembre). Si en abril el dólar estaba distinto, decime y lo cambio.</li></ul></div>
    <h2 class="sec">🧾 Gastos</h2>
    <form class="gform card" id="fGasto" novalidate>
      <b>➕ Cargar un gasto</b>
      <div class="gcampos">
        <label>Fecha<input type="date" name="fecha" value="${esc(f.fecha)}" required></label>
        <label>Concepto<input name="concepto" value="${esc(f.concepto)}" placeholder="Ej: Envío a Neuquén" required></label>
        <label>A quién<input name="proveedor" value="${esc(f.proveedor)}" placeholder="Ej: Ferro Carga"></label>
        <label>Cómo se pagó<select name="medio">${["Mercado Pago","Efectivo","Transferencia","Tarjeta","USD"].map(m=>`<option${m===f.medio?" selected":""}>${m}</option>`).join("")}</select></label>
        <label>Monto ($)<input name="monto" inputmode="decimal" value="${esc(f.monto)}" placeholder="Ej: 25000" required></label>
      </div>
      <button class="btn" type="submit" id="gGo">Guardar gasto</button>
      <div id="gMsg"></div>
    </form>
    ${gastos.length?`<div class="gl">${gastos.map(o=>`<div class="gi"><div><b>${esc(o.notas||o.contraparte||"Gasto")}</b><span>${new Date(o.fecha+"T12:00").toLocaleDateString("es-AR")} · ${esc([o.contraparte,o.canal].filter(Boolean).join(" · "))}</span></div><b class="gm">${fmtc(o.total)}</b></div>`).join("")}</div>`:`<div class="card vacio">Todavía no hay gastos.</div>`}
    <div class="infob" style="margin-top:14px"><ul><li>El costo sale de la <b>lista de precios actual</b>. Cuando carguemos la factura del primer pedido, se va a calcular con el costo real.</li><li>Falta el <b>monotributo de octubre</b>: cargalo acá cuando sepas el monto.</li></ul></div>`;
}
async function guardarGasto(form){
  const d=Object.fromEntries(new FormData(form)); S.gastoForm=d;
  const m=$("#gMsg"), monto=parseMonto(d.monto);
  if(!d.fecha||!d.concepto.trim()||!(monto>0)){ m.innerHTML=`<div class="err">Completá fecha, concepto y un monto mayor a 0.</div>`; return; }
  const b=$("#gGo"); b.disabled=true; b.textContent="Guardando…"; m.innerHTML="";
  const {error}=await sb.from("operaciones").insert({tipo:"gasto",fecha:d.fecha,contraparte:d.proveedor.trim()||null,canal:d.medio,total:monto,origen:"manual",notas:d.concepto.trim()});
  if(error){ b.disabled=false; b.textContent="Guardar gasto"; m.innerHTML=errHTML("No se pudo guardar el gasto: "+traducir(error.message)+". Lo que cargaste sigue acá."); m.querySelector("[data-reint]").onclick=()=>guardarGasto($("#fGasto")); return; }
  S.gastoForm=null; await cargarFinanzas();
}
/* ===== stock ===== */
async function cargarStock(){
  const {data,error}=await sb.from("stock_movimientos").select("sku,cantidad,lugar,productos(modelo,color,talle,costo)");
  if(error){ S.err.stock=traducir(error.message); pintar(); return; }
  S.err.stock=null; S.stock=data; pintar();
}
function stock(){
  const h=`<div class="hola"><div><p class="kick"><span></span>STOCK<span></span></p><h1>STO<span class="y">CK</span></h1><p>Por modelo y talle.</p></div></div>`;
  if(S.err.stock) return h+`<div data-carga="stock">${errHTML("No se pudo leer el stock: "+S.err.stock)}</div>`;
  if(S.stock==null) return h+`<p class="vacio">Cargando…</p>`;
  const cam=S.stock.filter(m=>m.lugar==="CAMINO"), g={};
  cam.forEach(m=>{ const k=m.productos.modelo+"|"+m.productos.color, t=m.productos.talle;
    const x=((g[k]=g[k]||{p:m.productos,t:{}}).t[t]=g[k].t[t]||{imp:0,res:0,costo:m.productos.costo});
    if(m.cantidad>0) x.imp+=m.cantidad; else x.res-=m.cantidad; });
  const tot=Object.values(g).flatMap(x=>Object.values(x.t)), imp=tot.reduce((a,x)=>a+x.imp,0), res=tot.reduce((a,x)=>a+x.res,0), val=tot.reduce((a,x)=>a+(x.imp-x.res)*x.costo,0);
  const otros=S.stock.some(m=>m.lugar!=="CAMINO");
  return h+`<h2 class="sec">🚚 Llega 28/10</h2>
    <div class="kpis"><div class="kpi" style="--c:var(--ink)"><div class="l">Importados</div><div class="n">${imp}</div><div class="d">pares en camino</div></div>
      <div class="kpi" style="--c:var(--y)"><div class="l">Reservados</div><div class="n">${res}</div><div class="d">ya tienen pedido</div></div>
      <div class="kpi"><div class="l">Libres para vender</div><div class="n">${imp-res}</div><div class="d">${fmt(val)} a costo</div></div></div>
    <div class="stk">${Object.values(g).map(x=>{ const ts=Object.entries(x.t).sort(), li=ts.reduce((a,[,v])=>a+v.imp-v.res,0);
      return `<div class="card"><h3>${esc(nombreDe(x.p))} <small>${li} libres</small></h3><table class="mini"><thead><tr><th>TALLE</th><th>IMPORT.</th><th>RESERV.</th><th>LIBRES</th></tr></thead><tbody>
        ${ts.map(([t,v])=>`<tr><td>${esc(t)}</td><td>${v.imp}</td><td>${v.res||"—"}</td><td class="m">${v.imp-v.res}</td></tr>`).join("")}</tbody></table></div>`; }).join("")}</div>
    ${otros?"":`<div class="infob" style="margin-top:14px"><ul><li>Falta cargar el stock real de <b>Sobre Ruedas, Fly Free y La Plata</b> (lo que hay hoy para ⚡ Depo BA). Pasámelo y lo sumo acá.</li></ul></div>`}`;
}
function proximo(k){
  const T={pedidos:["📦","PEDI","DOS","Cada pedido que hagan los clientes desde la página va a quedar acá: número de orden, cliente, productos, estado (nueva → confirmada → preparada → entregada) y el aviso por mail a sobreruedas.info.ar@gmail.com."],
    stock:["📊","STO","CK","Stock por modelo, talle y lugar (SR, Fly Free, La Plata y en camino), valorizado a costo. Para armarlo necesito que me confirmes el stock real de hoy."],
    finanzas:["💰","FINAN","ZAS","Te deben, le debés al proveedor, Mercado Pago, caja y resultado del mes, con la cuenta corriente de cada cliente. Para armarlo necesito cargar el historial: el capital, los 153 pares, el pedido del 17/09 y la seña de Neuquén."]}[k];
  return `<div class="hola"><div><p class="kick"><span></span>PRÓXIMAMENTE<span></span></p><h1>${T[1]}<span class="y">${T[2]}</span></h1></div></div>
    <div class="card" style="max-width:720px"><p style="margin:0;font-size:17px">${T[0]} ${esc(T[3])}</p></div>`;
}

/* ===== acciones ===== */
$("#tabs").addEventListener("click",e=>{ const b=e.target.closest(".tab"); if(!b) return; S.tab=b.dataset.t; if(S.tab==="clientes") S.filtro=null; if(S.tab==="pedidos") S.pedCli=null; pintar(); });
$("#cont").addEventListener("click",async e=>{
  const ir=e.target.closest("[data-ir]"); if(ir){ S.tab=ir.dataset.ir; if(S.tab==="clientes") S.filtro=null; pintar(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  const f=e.target.closest("[data-f]"); if(f){ S.filtro=f.dataset.f; pintar(); return; }
  const ver=e.target.closest("[data-ver]"); if(ver){ verPedido(Number(ver.dataset.ver)); return; }
  const vf=e.target.closest("[data-ver-fin]"); if(vf){ const id=Number(vf.dataset.verFin); S.tab="pedidos"; S.pedCli=null; pintar(); window.scrollTo({top:0}); if(S.pedidos) verPedido(id); return; }
  const pc=e.target.closest("[data-pc]"); if(pc){ S.pedCli=pc.dataset.pc?Number(pc.dataset.pc):null; S.tab="pedidos"; pintar(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  const ed=e.target.closest("[data-ed]"); if(ed){ S.editando=ed.dataset.ed?Number(ed.dataset.ed):null; pintar(); return; }
  const ap=e.target.closest("[data-ap]"), re=e.target.closest("[data-re]"); if(!ap&&!re) return;
  const b=ap||re, id=b.dataset.ap||b.dataset.re;
  const cambios=ap?{estado:"aprobado",categoria:$(`#cont [data-cat="${id}"]`).value}:{estado:"rechazado"};
  const guardar=async()=>{ b.disabled=true; const m=$(`#cont [data-m="${id}"]`); m.innerHTML="";
    const {error}=await sb.from("clientes").update(cambios).eq("id",id);
    if(error){ b.disabled=false; m.innerHTML=errHTML("No se pudo guardar: "+traducir(error.message)); m.querySelector("[data-reint]").onclick=guardar; return; }
    S.editando=null; cargarClientes(); };
  guardar();
});
$("#cont").addEventListener("submit",e=>{ if(e.target.id==="fGasto"){ e.preventDefault(); guardarGasto(e.target); } });
$("#cont").addEventListener("input",e=>{ if(e.target.closest("#fGasto")){ S.gastoForm=Object.fromEntries(new FormData($("#fGasto"))); return; } if(e.target.id!=="buscar") return; S.buscar=e.target.value; const pos=e.target.selectionStart; pintar(); const i=$("#buscar"); i.focus(); i.setSelectionRange(pos,pos); });

$("#pedX").onclick=()=>$("#pedS").classList.remove("show");
async function refrescarPedido(id){ await Promise.all([cargarPedidos(),cargarFinanzas(),cargarCompras()]); if($("#pedS").classList.contains("show")) verPedido(id); }
$("#pedB").addEventListener("click",async e=>{
  const b=e.target.closest("[data-est]"); if(!b||b.classList.contains("on")) return;
  const id=Number(b.dataset.id), est=b.dataset.est, m=$("#estMsg");
  if(est==="cancelada"&&!confirm("¿Cancelar este pedido? No se va a sumar en las ventas.")) return;
  const go=async()=>{ m.innerHTML=""; $("#pedB").querySelectorAll("[data-est]").forEach(x=>x.disabled=true);
    const {error}=await sb.from("operaciones").update({estado:est}).eq("id",id);
    if(error){ $("#pedB").querySelectorAll("[data-est]").forEach(x=>x.disabled=false); m.innerHTML=errHTML("No se pudo cambiar el estado: "+traducir(error.message)); m.querySelector("[data-reint]").onclick=go; return; }
    refrescarPedido(id); };
  go();
});
$("#pedB").addEventListener("input",e=>{ const f=e.target.closest("#fPago"); if(f) S.pagoForm={id:Number(f.dataset.id),...Object.fromEntries(new FormData(f))}; });
$("#pedB").addEventListener("submit",async e=>{
  const f=e.target.closest("#fPago"); if(!f) return; e.preventDefault();
  const id=Number(f.dataset.id), d=Object.fromEntries(new FormData(f)), m=$("#pMsg"); S.pagoForm={id,...d};
  const monto=parseMonto(d.monto);
  if(!d.fecha||!(monto>0)){ m.innerHTML=`<div class="err">Poné la fecha y un monto mayor a 0.</div>`; return; }
  const o=S.pedidos.find(x=>x.id===id), b=$("#pGo");
  const go=async()=>{ b.disabled=true; b.textContent="Guardando…"; m.innerHTML="";
    const {error}=await sb.from("pagos").insert({fecha:d.fecha,monto,medio:d.medio,notas:d.notas.trim()||null,operacion_id:id,cliente_id:o?.cliente_id||null});
    if(error){ b.disabled=false; b.textContent="💵 Registrar pago"; m.innerHTML=errHTML("No se pudo guardar el pago: "+traducir(error.message)+". Lo que cargaste sigue acá."); m.querySelector("[data-reint]").onclick=go; return; }
    S.pagoForm=null; refrescarPedido(id); };
  go();
});
$("#pedS").addEventListener("click",e=>{ if(e.target.id==="pedS") $("#pedS").classList.remove("show"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("#pedS").classList.remove("show"); });
if(!sb){ $("#vCarga").innerHTML='<div class="err">No se pudo conectar con el sistema. Revisá internet y recargá la página.</div>'; }
else sb.auth.onAuthStateChange((ev,session)=>setTimeout(()=>{
  if(!session){ S.user=null; S.clientes=S.productos=S.yo=null; ver("vLogin"); return; }
  if(ev==="TOKEN_REFRESHED"||(ev==="SIGNED_IN"&&S.user?.id===session.user.id)) return;
  entrar(session.user);
},0));
</script>
</body>
</html>
